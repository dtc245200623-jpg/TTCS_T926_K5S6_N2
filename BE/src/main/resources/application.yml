server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: auth-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:sqlserver://${DB_SERVER:localhost\SQLEXPRESS02};databaseName=${DB_NAME:TTCS_T926_K5S6_N2};encrypt=true;trustServerCertificate=true}}
    driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:123}
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:dtc245200623@ictu.edu.vn}
    password: ${MAIL_PASSWORD:syykmjwlzwekgovs}
    properties:
      mail: 
        smtp: 
          auth: true
          starttls:
            enable: true

jwt:
  # Secret key tối thiểu 256 bits cho HS256
  secret: ${JWT_SECRET:mySecretKeyForJwtSigningMustBeVeryLongAndSecure12345678}
  # Thời gian hết hạn của token: 24h = 86400000 ms
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

